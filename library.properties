name=MicroRIO
version=0.1.0
author=lostmachinist
maintainer=lostmachinist
sentence=Named telemetry and control over UDP, for a MicroRIO driver station.
paragraph=Declare named channels; the library negotiates a schema with the station once, then exchanges fixed binary frames. Transport agnostic (any Arduino UDP), hardware agnostic (no pin APIs), with a built-in watchdog and per-channel failstates for when the link or the operator's UI goes away. Telemetry is numbered and resent, so a dropped frame leaves no hole in the log. Fits an Uno.
category=Communication
